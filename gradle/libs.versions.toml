espressoCore = "3.6.1"
appcompat = "1.7.0"
material = "1.12.0"
activity = "1.10.1"
constraintlayout = "2.2.1"
work = "2.10.0"
retrofit = "2.11.0"
playServicesLocation = "21.3.0"
